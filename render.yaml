services:
  - type: web
    name: silod-server
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:server
    startCommand: pnpm --filter @silod/server start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: silod-web
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm build:web
    staticPublishPath: packages/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
